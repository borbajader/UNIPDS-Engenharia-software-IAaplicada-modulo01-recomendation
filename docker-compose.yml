version: '3.8'

services:
  # Aplicação Web Vibe3p (Node.js + Express + React)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibe3p-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SQL_HOST=postgres
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres_password
      - SQL_DB_NAME=vibe3p_db
    depends_on:
      postgres:
        condition: service_healthy

  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: vibe3p-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: vibe3p_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
